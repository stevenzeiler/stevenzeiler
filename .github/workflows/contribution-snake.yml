name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: stevenzeiler
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff8a00&color_dots=#0a0a0a,#1f2329,#2b3038,#8a939e,#f5a524
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff8a00&color_dots=#0a0a0a,#1f2329,#2b3038,#8a939e,#f5a524
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
