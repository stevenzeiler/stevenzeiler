<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .terminal-text-light { 
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        font-size: 16px;
      }
      .terminal-title-light { 
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        font-size: 72px;
        font-weight: 700;
      }
      .cursor-blink-light {
        animation: blink-light 1.2s infinite;
      }
      @keyframes blink-light {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
    
    <linearGradient id="amberGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8a00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5a524;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Terminal background -->
  <rect width="1200" height="300" fill="#f5f5f5"/>
  
  <!-- Terminal window frame -->
  <rect x="20" y="20" width="1160" height="260" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="1160" height="35" rx="8" fill="#e8e8e8"/>
  <rect x="20" y="38" width="1160" height="17" fill="#e8e8e8"/>
  
  <!-- Window control dots -->
  <circle cx="40" cy="37" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="37" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="37" r="6" fill="#27c93f"/>
  
  <!-- Terminal title -->
  <text x="600" y="43" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#5a5a5a" text-anchor="middle">
    steven@zeiler: ~
  </text>
  
  <!-- Prompt line -->
  <text x="40" y="85" class="terminal-text-light" fill="#2b3038">steven@zeiler</text>
  <text x="145" y="85" class="terminal-text-light" fill="#2b3038">:</text>
  <text x="155" y="85" class="terminal-text-light" fill="#3d7bd9">~</text>
  <text x="170" y="85" class="terminal-text-light" fill="#2b3038">$</text>
  <text x="185" y="85" class="terminal-text-light" fill="#f5a524">whoami</text>
  
  <!-- Output - Name -->
  <text x="40" y="130" class="terminal-title-light" fill="url(#amberGradLight)" filter="url(#glowLight)">
    STEVEN ZEILER
  </text>
  
  <!-- Output - Description line 1 -->
  <text x="40" y="175" font-family="'JetBrains Mono', Menlo, monospace" font-size="18" fill="#2b3038">
    <tspan fill="#ff8a00">»</tspan> Building AI agent infrastructure • Hyper-efficient money
  </text>
  
  <!-- Output - Description line 2 -->
  <text x="40" y="200" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2b3038">
    <tspan fill="#ff8a00">»</tspan> Huge AI • Material Samples Art • Payments since the Ripple days
  </text>
  
  <!-- Data visualization bars -->
  <text x="40" y="240" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#ff8a00" opacity="0.6">
    ▁▃▅▇█▇▅▃▁ <tspan fill="#5a5a5a">▂▄▆▅▄▂</tspan> ▁▃▅▇█▇▅▃▁ <tspan fill="#5a5a5a">▂▄▆▅▄▂</tspan> ▁▃▅▇█▇▅▃▁
  </text>
  
  <!-- Data flow indicator -->
  <text x="40" y="260" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" opacity="0.5">
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#5a5a5a">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#5a5a5a">... data flow</tspan>
  </text>
  
  <!-- Blinking cursor -->
  <rect x="690" y="118" width="14" height="20" fill="#ff8a00" class="cursor-blink-light"/>
</svg>
