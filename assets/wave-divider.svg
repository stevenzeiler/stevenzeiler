<svg width="100%" height="40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.6">
        <animate attributeName="stop-color" values="#ff00ff;#00ffff;#ff00ff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:0.6">
        <animate attributeName="stop-color" values="#00ffff;#ff00ff;#00ffff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0.6">
        <animate attributeName="stop-color" values="#ff00ff;#00ffff;#ff00ff" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <path d="M0,20 Q300,5 600,20 T1200,20 L1200,40 L0,40 Z" fill="url(#waveGradient)">
    <animate attributeName="d" 
      values="M0,20 Q300,5 600,20 T1200,20 L1200,40 L0,40 Z;
              M0,20 Q300,35 600,20 T1200,20 L1200,40 L0,40 Z;
              M0,20 Q300,5 600,20 T1200,20 L1200,40 L0,40 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
