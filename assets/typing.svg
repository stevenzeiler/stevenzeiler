<svg width="1200" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .typing-cmd { 
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        font-size: 16px;
      }
    </style>
  </defs>
  
  <rect width="1200" height="40" fill="#0a0a0a"/>
  
  <!-- Prompt -->
  <text x="10" y="25" class="typing-cmd">
    <tspan fill="#8a939e">$</tspan>
  </text>
  
  <!-- Phase 1: Building agents -->
  <text x="25" y="25" class="typing-cmd" fill="#f5a524" opacity="0">
    ./build --agents huge-ai --prod
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.02;0.30;0.33;0.35" dur="15s" repeatCount="indefinite"/>
  </text>
  
  <!-- Phase 2: Scanning materials -->
  <text x="25" y="25" class="typing-cmd" fill="#f5a524" opacity="0">
    scan ./material-samples --ml-vision --batch
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.35;0.37;0.63;0.66;0.68" dur="15s" repeatCount="indefinite"/>
  </text>
  
  <!-- Phase 3: Git log -->
  <text x="25" y="25" class="typing-cmd" fill="#f5a524" opacity="0">
    git log --since=2012 --author=stevenzeiler
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.68;0.70;0.98;1;1" dur="15s" repeatCount="indefinite"/>
  </text>
  
  <!-- Blinking cursor -->
  <text x="27" y="25" class="typing-cmd" opacity="0.9">
    <tspan fill="#ff8a00">█</tspan>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.02;0.98;1" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="x" 
      values="27;245;27;315;27;295;27" 
      keyTimes="0;0.33;0.35;0.66;0.68;0.98;1" 
      dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
