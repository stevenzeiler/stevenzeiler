<svg width="1200" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .typing-text { 
        font-family: 'Courier New', monospace; 
        font-size: 20px; 
        fill: #00ffff;
      }
      .cursor-blink {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>
  
  <!-- Phase 1: Building AI agent infrastructure -->
  <text x="20" y="28" class="typing-text" opacity="0">
    Building AI agent infrastructure at Huge AI
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.02;0.23;0.25;0.27" dur="20s" repeatCount="indefinite"/>
  </text>
  
  <!-- Phase 2: Producing deep house -->
  <text x="20" y="28" class="typing-text" opacity="0">
    Producing deep house &amp; disco as ZYLR
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.27;0.29;0.48;0.50;0.52" dur="20s" repeatCount="indefinite"/>
  </text>
  
  <!-- Phase 3: Digitizing materials -->
  <text x="20" y="28" class="typing-text" opacity="0">
    Digitizing thousands of design material samples
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.52;0.54;0.73;0.75;0.77" dur="20s" repeatCount="indefinite"/>
  </text>
  
  <!-- Phase 4: Built gatewayd -->
  <text x="20" y="28" class="typing-text" opacity="0">
    Built gatewayd at Ripple
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.77;0.79;0.98;1;1" dur="20s" repeatCount="indefinite"/>
  </text>
  
  <!-- Blinking cursor -->
  <text x="22" y="28" class="typing-text" opacity="0.8">
    <tspan dx="0">▌</tspan>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.02;0.98;1" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="x" 
      values="22;340;22;270;22;370;22;190;22" 
      keyTimes="0;0.25;0.27;0.50;0.52;0.75;0.77;0.98;1" 
      dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
