<svg width="1200" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .terminal-text { 
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        font-size: 16px;
      }
      .terminal-title { 
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        font-size: 72px;
        font-weight: 700;
      }
      .cursor-blink {
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
    
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8a00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5a524;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Terminal background -->
  <rect width="1200" height="320" fill="#0a0a0a"/>
  
  <!-- Terminal window frame -->
  <rect x="20" y="20" width="1160" height="280" rx="8" fill="#111418" stroke="#2b3038" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="1160" height="35" rx="8" fill="#1f2329"/>
  <rect x="20" y="38" width="1160" height="17" fill="#1f2329"/>
  
  <!-- Window control dots -->
  <circle cx="40" cy="37" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="37" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="37" r="6" fill="#27c93f"/>
  
  <!-- Terminal title -->
  <text x="600" y="43" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8a939e" text-anchor="middle">
    steven@zeiler: ~
  </text>
  
  <!-- Prompt line -->
  <text x="40" y="85" class="terminal-text" fill="#8a939e">steven@zeiler</text>
  <text x="145" y="85" class="terminal-text" fill="#8a939e">:</text>
  <text x="155" y="85" class="terminal-text" fill="#3d7bd9">~</text>
  <text x="170" y="85" class="terminal-text" fill="#8a939e">$</text>
  <text x="185" y="85" class="terminal-text" fill="#f5a524">whoami</text>
  
  <!-- Output - Name (moved down with clear spacing) -->
  <text x="40" y="150" class="terminal-title" fill="url(#amberGrad)" filter="url(#glow)">
    STEVEN ZEILER
  </text>
  
  <!-- Blinking cursor (right after the name) -->
  <rect x="690" y="118" width="14" height="20" fill="#ff8a00" class="cursor-blink"/>
  
  <!-- Output - Description line 1 -->
  <text x="40" y="195" font-family="'JetBrains Mono', Menlo, monospace" font-size="18" fill="#8a939e">
    <tspan fill="#ff8a00">»</tspan> Building AI agent infrastructure • Hyper-efficient money
  </text>
  
  <!-- Output - Description line 2 -->
  <text x="40" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#8a939e">
    <tspan fill="#ff8a00">»</tspan> Huge AI • Material Samples Art • Payments since the Ripple days
  </text>
  
  <!-- Data visualization bars (generic signal processing) -->
  <text x="40" y="260" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#ff8a00" opacity="0.6">
    ▁▃▅▇█▇▅▃▁ <tspan fill="#8a939e">▂▄▆▅▄▂</tspan> ▁▃▅▇█▇▅▃▁ <tspan fill="#8a939e">▂▄▆▅▄▂</tspan> ▁▃▅▇█▇▅▃▁
  </text>
  
  <!-- Data flow indicator -->
  <text x="40" y="280" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" opacity="0.5">
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#f5a524">█</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#ff8a00">│</tspan>
    <tspan fill="#ff8a00">█</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">▓</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">░</tspan>
    <tspan fill="#8a939e">... data flow</tspan>
  </text>
</svg>
